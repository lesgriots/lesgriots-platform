<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Les Griots</title>
<meta name="description" content="Les Griots — bientôt." />
<meta name="robots" content="noindex" />
<meta property="og:title" content="Les Griots" />
<meta property="og:description" content="Bientôt." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    position: fixed;
    inset: 0;
    touch-action: none;   /* le scroll est piloté à la main (molette / doigt) */
    font-family: "Instrument Serif", "Times New Roman", Georgia, serif;
    color: #f4efe3;
  }

  /* ---- Vidéo d'accueil — plein écran, derrière tout ------------------- */
  .home-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    opacity: 0;
    animation: fade 1.6s ease 0.2s forwards;
    transition: transform .7s cubic-bezier(.16, 1, .3, 1), filter .7s cubic-bezier(.16, 1, .3, 1);
    will-change: transform;
  }
  /* Profondeur : la vidéo recule doucement quand l'About est ouvert */
  body.open .home-video { transform: scale(1.045); filter: brightness(.5); }
  /* Léger voile pour que le logo reste lisible sur la vidéo */
  .veil {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55));
  }


  /* ---- Logo pleine largeur en bas ------------------------------------- */
  .logo {
    position: fixed;
    left: 0; bottom: 0;
    width: 100vw; height: auto;
    display: block;
    z-index: 6;                 /* au-dessus du panneau About, comme sur le site */
    opacity: 0; animation: fade 1.4s ease forwards;
    -webkit-user-select: none; user-select: none; -webkit-user-drag: none;
    pointer-events: none;
    will-change: transform;
  }
  @keyframes fade { to { opacity: 1; } }

  /* ---- Indice de scroll ------------------------------------------------ */
  .hint {
    position: fixed;
    top: 22px; right: 24px;
    z-index: 3;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244,239,227,0.55);
    opacity: 0;
    animation: fade 1.4s ease 1.2s forwards;
    transition: opacity 0.4s ease;
  }
  body.open .hint { opacity: 0; }

  /* ---- Panneau ABOUT — monte au scroll --------------------------------- */
  .about {
    position: fixed;
    inset: 0;
    z-index: 5;                 /* sous le logo docké en haut */
    background: #0a0a0a;
    transform: translate3d(0, 100%, 0);
    will-change: transform;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(28px, 5vh, 56px);
    /* le logo pleine largeur est docké en haut pendant que l'About est ouvert */
    padding: calc(100vw / 3.89 + 4vh) 24px 6vh;
    text-align: center;
    overflow-y: auto;
  }
  .about-text {
    max-width: 720px;
    font-size: clamp(19px, 2.6vw, 28px);
    line-height: 1.45;
    letter-spacing: -0.01em;
    color: rgba(244,239,227,0.92);
  }
  .about-text em { font-style: italic; color: #F1B81F; }
  .about-sites {
    display: flex;
    gap: clamp(16px, 3vw, 36px);
    flex-wrap: wrap;
    justify-content: center;
  }
  .about-sites a {
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-decoration: none;
    color: rgba(244,239,227,0.75);
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    transition: color 0.25s ease, transform 0.25s ease;
  }
  .about-sites a:hover { color: #F1B81F; transform: translateY(-3px); }
  .about-sites img {
    width: clamp(110px, 16vw, 170px);
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    filter: grayscale(0.15);
    transition: filter 0.25s ease;
  }
  .about-sites a:hover img { filter: none; }
  .about-sites a.no-img img { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .logo, .home-video, .hint { animation: none; opacity: 1; }
  }
</style>
</head>

<script>
  (function () {
    // === Même mécanique d'arrivée que le site, adaptée à l'attente ===
    // Phase 1 : premier scroll → le logo (pleine largeur, en bas) monte se
    //           docker en haut de l'écran (lerp vif).
    // Phase 2 : une fois le logo docké, le panneau About monte par le bas
    //           (tween 300ms) et reste sous le logo.
    // Retour  : scroll vers le haut (About en haut de son scroll) → l'About
    //           redescend, puis le logo revient en bas.
    var logo = document.querySelector('.logo');
    var about = document.getElementById('about');
    var body = document.body;
    var seq = 0;              // 0 accueil · 1 logo monte · 2 ouvert · 3 fermeture
    var cur = 0, tgt = 0;     // translateY du logo (px)

    function logoTravel() {
      return -Math.max(0, window.innerHeight - (logo.offsetHeight || 0));
    }

    function openArrival() {
      if (seq !== 0) return;
      seq = 1;
      tgt = logoTravel();
    }

    function slidePanel(open, done) {
      var t0 = performance.now();
      (function tw(now) {
        var t = Math.min(1, (now - t0) / 300);
        var e = (t === 1 ? 1 : 1 - Math.pow(2, -10 * t));
        var y = open ? (1 - e) * 100 : e * 100;
        about.style.transform = 'translate3d(0,' + y + '%,0)';
        if (t < 1) requestAnimationFrame(tw);
        else if (done) done();
      })(t0);
    }

    function onDocked() {
      if (seq !== 1) return;
      seq = 2;
      body.classList.add('open');
      about.setAttribute('aria-hidden', 'false');
      slidePanel(true);
    }

    function closeArrival() {
      if (seq !== 2) return;
      seq = 3;
      slidePanel(false, function () {
        body.classList.remove('open');
        about.setAttribute('aria-hidden', 'true');
        tgt = 0;              // le logo redescend
      });
    }

    window.addEventListener('wheel', function (e) {
      e.preventDefault();
      if (seq === 0 && e.deltaY > 0) openArrival();
      else if (seq === 2) {
        if (e.deltaY < 0 && about.scrollTop <= 0) closeArrival();
        else about.scrollTop += e.deltaY;   // contenu plus haut que l'écran
      }
    }, { passive: false });

    var touchY = null;
    window.addEventListener('touchstart', function (e) {
      touchY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchmove', function (e) {
      e.preventDefault();
      if (touchY === null) return;
      var dy = touchY - e.touches[0].clientY;   // >0 = swipe vers le haut
      if (seq === 0 && dy > 24) { openArrival(); touchY = null; }
      else if (seq === 2) {
        if (dy < -24 && about.scrollTop <= 0) { closeArrival(); touchY = null; }
        else { about.scrollTop += dy; touchY = e.touches[0].clientY; }
      }
    }, { passive: false });
    window.addEventListener('touchend', function () { touchY = null; });

    // Clic sur la vidéo = même déclencheur que le site
    window.addEventListener('click', function () { if (seq === 0) openArrival(); });

    (function tick() {
      var k = (seq === 1) ? 0.14 : 0.08;   // phase 1 : montée directe et vive
      cur += (tgt - cur) * k;
      if (Math.abs(tgt - cur) < 0.6) {
        cur = tgt;
        if (seq === 1) onDocked();
        if (seq === 3 && tgt === 0) seq = 0;
      }
      logo.style.transform = 'translate3d(0,' + cur + 'px,0)';
      requestAnimationFrame(tick);
    })();
  })();
</script>
