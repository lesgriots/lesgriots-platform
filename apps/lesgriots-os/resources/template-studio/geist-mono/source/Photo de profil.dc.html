<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
</style>
</helmet>
<div style="background:#E6E4DD; min-height:100%; width:100%; display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:center; gap:56px; padding:70px 40px;">

  <!-- A — NOIR -->
  <div style="display:flex; flex-direction:column; align-items:center; gap:18px;">
    <div style="font-family:monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:#7a7a72;">A · Noir</div>
    <div style="width:340px; height:340px; background:#0B0B0A; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:0 38px;">
      <img src="logo-wordmark.svg" alt="LA GRIOTHÈQUE" style="width:100%; height:auto; display:block; filter:invert(1);">
    </div>
  </div>

  <!-- B — JAUNE -->
  <div style="display:flex; flex-direction:column; align-items:center; gap:18px;">
    <div style="font-family:monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:#7a7a72;">B · Jaune</div>
    <div style="width:340px; height:340px; background:#F5CE16; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:0 38px;">
      <img src="logo-wordmark.svg" alt="LA GRIOTHÈQUE" style="width:100%; height:auto; display:block;">
    </div>
  </div>

  <!-- C — CRÈME -->
  <div style="display:flex; flex-direction:column; align-items:center; gap:18px;">
    <div style="font-family:monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:#7a7a72;">C · Crème</div>
    <div style="width:340px; height:340px; background:#F1EFE8; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:0 38px;">
      <img src="logo-wordmark.svg" alt="LA GRIOTHÈQUE" style="width:100%; height:auto; display:block;">
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
