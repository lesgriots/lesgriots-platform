<!-- ── VERROU PAYSAGE (smartphone) — LG_ROTATE_GATE ──────────────────────
     Le site se lit en portrait. Quand un téléphone passe en paysage, on ne
     réagence pas la page : on la garde en vertical en pivotant le contenu
     de -90° (ou +90° selon le sens de rotation, lu via screen.orientation).
     Aucun message : le site reste simplement droit.
     Tablettes et desktop non concernés (max-height 520px + pointer:coarse).
     Bloc auto-suffisant, injecté avant la fermeture du body de
     site.html / attente.html / index.html. -->
<style>
@media (orientation: landscape) and (max-height: 520px) and (pointer: coarse) {
  html { overflow: hidden !important; height: 100% !important; }
  body {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vh !important;
    height: 100vw !important;
    overflow-x: hidden !important;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
    transform-origin: 0 0 !important;
    /* téléphone tourné dans un sens : on compense de -90° */
    transform: rotate(-90deg) translateX(-100%) !important;
  }
  /* tourné dans l'autre sens : on compense de +90° */
  html[data-lg-rot="270"] body {
    transform: rotate(90deg) translateY(-100%) !important;
  }
}
</style>
<script>
(function () {
  // Sens de rotation de l'écran : on compense l'angle pour garder le contenu
  // droit, quel que soit le côté vers lequel le téléphone est tourné.
  function lgRot() {
    var a;
    if (window.screen && screen.orientation && typeof screen.orientation.angle === "number") {
      a = screen.orientation.angle;
    } else if (typeof window.orientation === "number") {
      a = window.orientation < 0 ? window.orientation + 360 : window.orientation;
    }
    document.documentElement.setAttribute("data-lg-rot", a === 270 ? "270" : "90");
  }
  lgRot();
  window.addEventListener("orientationchange", function () { setTimeout(lgRot, 60); });
  window.addEventListener("resize", lgRot);
})();
</script>
<!-- ── /LG_ROTATE_GATE ─────────────────────────────────────────────── -->
