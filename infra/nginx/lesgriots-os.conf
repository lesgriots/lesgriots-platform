# LES GRIOTS OS — os.lesgriots.com
#
# Reverse proxy vers l'app Next.js servie par systemd sur localhost:3010
# (unité lesgriots-os.service, code dans apps/lesgriots-os/).
#
# Pourquoi un SOUS-DOMAINE DÉDIÉ (et pas admin.lesgriots.com/os/) :
#   1. L'app n'a pas de basePath Next.js — la servir sous un sous-path
#      exigerait de modifier le code (basePath, cookies, redirects OAuth).
#   2. Le Basic auth global d'admin.lesgriots.com casserait :
#      - le serveur MCP, qui s'authentifie par header `x-api-key`
#        (un client MCP ne sait pas répondre à un challenge Basic auth) ;
#      - le callback Google OAuth (redirect_uri déclaré côté Google).
#   3. L'OS a déjà sa propre défense : login Google OAuth + whitelist
#      d'utilisateurs en base + RBAC (admin/manager/collaborateur) + clé API.
#   → PAS de Basic auth ici, c'est un choix documenté (cf. docs/DEPLOY-OS.md).
#
# À copier sur le VPS :
#   sudo cp infra/nginx/lesgriots-os.conf /etc/nginx/sites-available/os.lesgriots.com.conf
#   sudo ln -sf /etc/nginx/sites-available/os.lesgriots.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name os.lesgriots.com;

    # Uploads (imports, logos, pièces jointes) — 20 Mo max
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # La génération de PDF (Python reportlab, synchrone) peut prendre
        # plusieurs secondes → timeouts confortables mais bornés.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;
    }

    # Headers de sécurité — surface sensible (données clients/finances)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
# NB : le bloc HTTPS (listen 443) sera ajouté automatiquement par Certbot :
#   sudo certbot --nginx -d os.lesgriots.com
