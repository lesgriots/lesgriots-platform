# LES GRIOTHÈQUE OS — app.lagriotheque.com
#
# Reverse proxy vers l'app Next.js servie par systemd sur localhost:3010
# (unité lesgriots-os.service, code dans apps/lesgriots-os/).
#
# Pourquoi un SOUS-DOMAINE DÉDIÉ (et pas admin.lesgriots.com/os/) :
#   1. L'app n'a pas de basePath Next.js — la servir sous un sous-path
#      exigerait de modifier le code (basePath, cookies, redirects OAuth).
#   2. Le Basic auth global d'admin.lesgriots.com casserait :
#      - le serveur MCP, qui s'authentifie par header `x-api-key` ;
#      - le callback Google OAuth (redirect_uri déclaré côté Google).
#   3. L'OS a déjà sa propre défense : login Google OAuth + whitelist
#      d'utilisateurs en base + RBAC (admin/manager/collaborateur) + clé API.
#   → PAS de Basic auth ici, c'est un choix documenté (cf. docs/DEPLOY-OS.md).
#
# Domaine retenu le 26/07/2026 : app.lagriotheque.com (cahier des charges OS
# v1.0, section 3). L'ancienne cible os.lesgriots.com n'a jamais été posée.

server {
    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    server_name app.lagriotheque.com;

    ssl_certificate /etc/letsencrypt/live/app.lagriotheque.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.lagriotheque.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Uploads (imports, logos, pièces jointes) — 20 Mo max
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # L'OS est une application authentifiée : ne jamais laisser le
        # navigateur conserver une page HTML rendue avant un déploiement.
        # Les assets Next sont versionnés ; l'absence de cache sur ce proxy
        # privilégie donc l'affichage immédiat de la dernière interface.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, private, max-age=0" always;

        # La génération de PDF (Python reportlab, synchrone) peut prendre
        # plusieurs secondes → timeouts confortables mais bornés.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;
    }

    # Headers de sécurité — surface sensible (données clients/finances)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# HTTP reste uniquement une entrée de redirection vers la version sécurisée.
server {
    if ($host = app.lagriotheque.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name app.lagriotheque.com;
    return 404; # managed by Certbot
}
