# Admin centralisé — admin.lesgriots.com
#
# Hub admin pour TOUS les back-offices de l'écosystème LES GRIOTS.
# Chaque pilier a son propre sous-path qui reverse-proxy vers son port local.
#
#   admin.lesgriots.com/studio/      → BO Studio        (Next.js port 3030)
#   admin.lesgriots.com/griotheque/  → BO Griothèque    (Next.js port 3031)
#   admin.lesgriots.com/lesgriots/   → BO Les Griots    (Next.js port 3032)
#   admin.lesgriots.com/production/  → BO Production    (futur)
#
# Convention (2026-07) : 1 pilier = 1 sous-path /<pilier>/ + 1 port dédié +
# 1 service systemd + basePath Next.js "/<pilier>" + proxy_pass SANS slash
# final (préserve le préfixe). L'ancien admin.lagriotheque.com redirige ici.
#
# NB : LES GRIOTS OS n'est PAS ici — il vit sur son propre sous-domaine
#      os.lesgriots.com (cf. lesgriots-os.conf) : pas de basePath Next.js,
#      et le Basic auth ci-dessous casserait son MCP (x-api-key) et son
#      callback Google OAuth.
#
# Pourquoi un sous-domaine unique :
#   1. 1 seul certif Let's Encrypt à renouveler
#   2. Cookies isolés des sites publics (sécurité)
#   3. Possibilité d'ajouter IP whitelist / VPN devant TOUT l'admin d'un coup
#   4. Hub unique = 1 bookmark à retenir pour Moos

server {
    listen 80;
    listen [::]:80;
    server_name admin.lesgriots.com;

    # Protection HTTP Basic auth en plus du login interne de chaque BO.
    # Le fichier .htpasswd est généré une fois sur le VPS avec :
    #   sudo htpasswd -c /etc/nginx/.htpasswd moos
    auth_basic "Zone privée LES GRIOTS";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Uploads BO : vidéos sources lourdes (films complets) envoyées via
    # /api/upload puis découpées par le découpeur. 2G + timeouts longs —
    # aligné sur la conf live du 13/07/2026 (avant : 200M → 413 sur les
    # gros films).
    client_max_body_size 2G;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # Page d'accueil minimale = redirige vers le BO Studio tant qu'il est seul.
    # Plus tard, on pourra servir un index.html listant tous les piliers.
    location = / {
        return 302 /studio/;
    }

    # ═══ BO STUDIO ═══════════════════════════════════════════════════════
    # Next.js app servie sur localhost:3030.
    # Next.js a basePath: "/studio" dans next.config.js → il s'attend à
    # recevoir les requêtes avec le préfixe /studio/ intact. nginx doit donc
    # transmettre le PATH COMPLET (sans strip).
    #
    # ⚠️ proxy_pass SANS slash final → préserve le path d'origine.
    #     proxy_pass http://127.0.0.1:3030;     ← correct
    #     proxy_pass http://127.0.0.1:3030/;    ← strip "/studio/" et casse les assets
    location /studio/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /studio;
        proxy_cache_bypass $http_upgrade;
    }

    # ═══ BO GRIOTHÈQUE ═══════════════════════════════════════════════════
    # Next.js basePath "/griotheque" → proxy_pass SANS slash final (préserve
    # le préfixe, ne casse pas les assets _next/). Nécessite que le BO
    # Griothèque ait basePath "/griotheque" en prod + rebuild.
    location /griotheque/ {
        proxy_pass http://127.0.0.1:3031;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /griotheque;
        proxy_cache_bypass $http_upgrade;
    }

    # ═══ BO LES GRIOTS (ombrelle) ════════════════════════════════════════
    # Next.js basePath "/lesgriots" (déjà configuré) → proxy_pass SANS slash final.
    location /lesgriots/ {
        proxy_pass http://127.0.0.1:3032;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /lesgriots;
        proxy_cache_bypass $http_upgrade;
    }

    # Headers de sécurité — admin = surface sensible.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
# NB : le bloc HTTPS (listen 443) sera ajouté automatiquement par Certbot.
