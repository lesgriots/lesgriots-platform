# admin.lagriotheque.com — REDIRECTION vers le hub centralisé.
#
# Convention 2026-07 : tous les back-offices vivent sous admin.lesgriots.com/<pilier>/.
# L'ancien admin de la Griothèque redirige donc vers admin.lesgriots.com/griotheque/.
# Le certificat admin.lagriotheque.com existant est conservé (déjà émis par Certbot).
#
# ⚠️ EXCEPTIONS — le site public lagriotheque.com appelle en fetch() direct :
#     /api/leads, /api/subscribe (+ /api/stripe/create-payment-intent, prévu public
#     dans le middleware du BO). Ces endpoints ne doivent NI rediriger NI exiger
#     de Basic auth : on les proxifie vers le BO en réécrivant vers le nouveau
#     basePath /griotheque. Tout le reste → 301 vers le hub.

server {
    server_name admin.lagriotheque.com;

    # Endpoints PUBLICS du site lagriotheque.com — proxy direct, pas de redirect.
    # proxy_pass AVEC URI : réécrit le path vers le basePath /griotheque du BO.
    location = /api/leads {
        proxy_pass http://127.0.0.1:3031/griotheque/api/leads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/subscribe {
        proxy_pass http://127.0.0.1:3031/griotheque/api/subscribe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/stripe/create-payment-intent {
        proxy_pass http://127.0.0.1:3031/griotheque/api/stripe/create-payment-intent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tout le reste : redirection permanente vers le hub.
    location / {
        return 301 https://admin.lesgriots.com/griotheque/;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.lagriotheque.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.lagriotheque.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = admin.lagriotheque.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    listen [::]:80;
    server_name admin.lagriotheque.com;
    return 404; # managed by Certbot
}
