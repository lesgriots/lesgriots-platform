# admin.lagriotheque.com — REDIRECTION vers le hub centralisé.
#
# Convention 2026-07 : tous les back-offices vivent sous admin.lesgriots.com/<pilier>/.
# L'ancien admin de la Griothèque redirige donc vers admin.lesgriots.com/griotheque/.
# Le certificat admin.lagriotheque.com existant est conservé (déjà émis par Certbot).

server {
    listen 80;
    listen [::]:80;
    server_name admin.lagriotheque.com;
    return 301 https://admin.lesgriots.com/griotheque/;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.lagriotheque.com;

    ssl_certificate     /etc/letsencrypt/live/admin.lagriotheque.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.lagriotheque.com/privkey.pem;

    return 301 https://admin.lesgriots.com/griotheque/;
}
