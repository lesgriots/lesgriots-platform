# Hub admin — BO Griothèque
# Inclus depuis les server blocks de admin.lesgriots.com.conf (80 ET 443).
#
# ⚠️ Ne l'activer QU'APRÈS avoir rebuildé le BO Griothèque avec
#    basePath "/griotheque" (next.config.js), sinon les assets _next/
#    seront servis à la racine et la page sera cassée.
#
# Next.js basePath "/griotheque" → proxy_pass SANS slash final.

# /griotheque SANS slash : proxifié directement. Sans ce bloc, nginx renvoie
# 301 → /griotheque/ et Next 308 → /griotheque : boucle de redirection infinie
# (même piège que /lesgriots, corrigé en b2f37df).
location = /griotheque {
    proxy_pass http://127.0.0.1:3031;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /griotheque;
}

location /griotheque/ {
    proxy_pass http://127.0.0.1:3031;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /griotheque;
    proxy_cache_bypass $http_upgrade;
}
