# lesgriots.com — fichiers internes JAMAIS servis directement.
#
# Modèle mono-fichier : la SEULE page publique est index.html. Elle porte
# elle-même son état (mode attente/live + pages actives), écrit par le BO
# dans le bloc de config au moment de l'export. Il n'y a plus de fichier
# « attente » séparé.
#
# Ce snippet reste indispensable : site.html est le TEMPLATE versionné, dont
# le mode par défaut est « live ». Sans blocage, un visiteur pourrait ouvrir
# /site.html et voir le site navigable même quand index.html est en attente.
# On bloque donc tous les fichiers internes (les entrées attente*.html sont
# désormais sans objet mais laissées par sécurité, elles ne coûtent rien).
#
# Inclus depuis les server blocks de lesgriots.com.conf, juste après
# server_name (les locations regex déclarées ICI passent avant celles du
# fichier principal — ordre d'apparition).

location ~* ^/(site|site\.live|attente|attente\.live|archive|boutique|specimens|index\.slideover-backup)\.html$ { return 404; }
location ~* (\.placeholder\.html$|^/_old-|^/apercu-|^/tweaks-panel\.jsx$|^/image-slot\.js$) { return 404; }

# La page active (index.html) ne doit JAMAIS être mise en cache : sinon un
# navigateur qui a vu le site complet peut le resservir alors que la page
# d'attente est active (vu le 19/07). Les requêtes sur / redirigent en
# interne vers /index.html → ce bloc couvre les deux.
location = /index.html { expires -1; }
