# Site statique — lagriotheque.com (servi depuis le monorepo)
#
# Stratégie de cache :
#   - HTML / CSS / JSX / data.jsx → no-cache (revalidation à chaque visite,
#     ETag → 304 si inchangé). Un export depuis le BO est visible immédiatement.
#   - Images / vidéos / polices → cache long 30 jours (fichiers immuables,
#     les uploads du BO génèrent des noms uniques).
server {
    server_name lagriotheque.com www.lagriotheque.com;

    root /var/www/ecosystem/production/lesgriots-platform/apps/lagriotheque;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|woff2?|mp4|webm|m4v|mov)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|jsx?|json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lagriotheque.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lagriotheque.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.lagriotheque.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = lagriotheque.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name lagriotheque.com www.lagriotheque.com;
    return 404; # managed by Certbot
}
